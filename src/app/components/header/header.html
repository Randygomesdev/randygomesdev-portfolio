<header class="sticky top-0 z-50 backdrop-blur-md bg-brand-dark/80 border-b border-zinc-800/80 px-4 sm:px-8 py-4">
      <div class="max-w-7xl mx-auto flex items-center justify-between">        
        <a href="#" class="flex items-center gap-2 text-xl font-bold tracking-tight text-zinc-100 hover:text-emerald-400 transition-colors">
          <svg lucideCodeXml class="w-5 h-5 text-emerald-500"></svg>
          <span>RandyGomes<span class="text-emerald-500">.dev</span></span>
        </a>

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-zinc-400">
          <a href="#about-me" class="hover:text-emerald-500 transition-colors">Quem Sou Eu</a>
          <a href="#skills" class="hover:text-emerald-500 transition-colors">Habilidades</a>
          <a href="#projetos" class="hover:text-emerald-500 transition-colors">Projetos</a>
          <a href="#contato" class="hover:text-emerald-500 transition-colors">Contato</a>
        </nav>

        <!-- Mobile Menu Toggle Button -->
        <button 
          (click)="toggleMenu()"
          class="md:hidden p-2 text-zinc-400 hover:text-zinc-100 focus:outline-none"
          aria-label="Toggle menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            @if (!isMenuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            }
          </svg>
        </button>
      </div>

      <!-- Mobile Dropdown Menu -->
      @if (isMenuOpen()) {
        <nav class="md:hidden mt-4 pt-4 border-t border-zinc-800 flex flex-col gap-4 text-sm font-medium text-zinc-300">
          <a href="#about-me" (click)="toggleMenu()" class="hover:text-emerald-500">Quem Sou Eu</a>
          <a href="#projetos" (click)="toggleMenu()" class="hover:text-emerald-500">Projetos</a>
          <a href="#skills" (click)="toggleMenu()" class="hover:text-emerald-500">Habilidades</a>
          <a href="#contato" (click)="toggleMenu()" class="hover:text-emerald-500">Contato</a>
        </nav>
      }
    </header>
